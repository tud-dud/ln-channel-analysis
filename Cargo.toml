[package]
name = "channel-properties"
version = "0.1.0"
edition = "2024"

[workspace.package]
authors = ["Charmaine Ndolo <charmaine.ndolo@tu-dresden.de>"]
license = "MIT"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.8"
log = "0.4"
reqwest = { version = "0.13", features = ["blocking"], default-features = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
