[workspace]
resolver = "3"

members = ["channel-frequency", "common", "tx-properties"]

[workspace.package]
authors = ["Charmaine Ndolo <charmaine.ndolo@tu-dresden.de>"]
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5.23", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.13", features = ["blocking"], default-features = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
